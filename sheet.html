<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Live Sheet</title>
  <!-- reuse your font-face declarations -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- pixel background -->
  <img
    class="background-pixel"
    src="Background.gif"
    alt=""
  />

  <!-- header to match your homepage style -->
  <div class="name-title">
    <p class="name">Live Data</p>
    <p class="title">Updated in Real-Time</p>
  </div>

  <!-- sheet container -->
  <div class="sheet-wrapper">
    <table id="sheet-table">
      <thead>
        <!-- filled in by JS -->
      </thead>
      <tbody>
        <!-- filled in by JS -->
      </tbody>
    </table>
  </div>

  <footer class="site-footer">
    <p>DESIGN BY FLESH, PRODUCTION OF MACHINE, PRODUCED BY MAN.</p>
    <p> - ZIONDAMAN - </p>
  </footer>

  <script>
  // ——— CONFIGURE THIS ———
  const SHEET_ID = '2PACX-1vTWj12eeHUgAAnIlaAMfALgxn7DdmGch_8wVZI9Sxahaudc5wv96Srbxs45oFYhtOAIJy87EbrIjS_F';
  const SHEET_GID = '0';

  // this will be called with the sheet data
  function handleSheet(json) {
    const cols = json.table.cols.map(c => c.label || c.id);
    const rows = json.table.rows;

    // header
    const thead = document.querySelector('#sheet-table thead');
    const headerRow = document.createElement('tr');
    cols.forEach(text => {
      const th = document.createElement('th');
      th.textContent = text;
      headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);

    // body (skip empty rows)
    const tbody = document.querySelector('#sheet-table tbody');
    rows.forEach(r => {
      const hasData = r.c.some(c => c && c.v != null && c.v.toString().trim() !== '');
      if (!hasData) return;
      const tr = document.createElement('tr');
      r.c.forEach(c => {
        const td = document.createElement('td');
        td.textContent = (c && c.v != null) ? c.v : '';
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }

  window.addEventListener('DOMContentLoaded', () => {
    const url =
      `https://docs.google.com/spreadsheets/d/e/${SHEET_ID}/gviz/tq` +
      `?gid=${SHEET_GID}` +
      `&tqx=out:json;responseHandler:handleSheet`;
    const s = document.createElement('script');
    s.src = url;
    document.body.appendChild(s);
  });
</script>

  
</body>
</html>

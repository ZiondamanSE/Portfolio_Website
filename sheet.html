<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Live Sheet</title>
  <!-- your existing CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- pixel background -->
  <img class="background-pixel" src="Background.gif" alt="" />

  <!-- header matching your homepage -->
  <div class="name-title">
    <p class="name">Live Data</p>
    <p class="title">Updated in Real-Time</p>
  </div>

  <!-- sheet container -->
  <div class="sheet-wrapper">
    <table id="sheet-table">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>

  <footer class="site-footer">
    <p>DESIGN BY FLESH, PRODUCTION OF MACHINE, PRODUCED BY MAN.</p>
    <p> - ZIONDAMAN - </p>
  </footer>

  <script>
    // ——— CONFIGURE YOUR PUBLISHED CSV URL ———
    const CSV_URL = 
      'https://docs.google.com/spreadsheets/d/e/2PACX-1vTWj12eeHUgAAnIlaAMfALgxn7DdmGch_8wVZI9Sxahaudc5wv96Srbxs45oFYhtOAIJy87EbrIjS_F/pub?gid=0&single=true&output=csv';

    // AllOrigins proxy
    const PROXY = 'https://api.allorigins.win/raw?url=';

    async function loadSheet() {
      try {
        const res = await fetch(PROXY + encodeURIComponent(CSV_URL));
        if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
        const csv = await res.text();
        renderCSV(csv);
      } catch (e) {
        console.error('Failed to load sheet:', e);
        const msg = document.createElement('p');
        msg.textContent = '⚠️ Could not load data. See console.';
        msg.style.color = 'tomato';
        document.querySelector('.sheet-wrapper').appendChild(msg);
      }
    }

    function renderCSV(csvText) {
      const lines = csvText.trim().split('\n').map(l => l.split(','));
      if (lines.length === 0) return;

      const [header, ...rows] = lines;

      // build header
      const thead = document.querySelector('#sheet-table thead');
      const trh = document.createElement('tr');
      header.forEach(col => {
        const th = document.createElement('th');
        th.textContent = col;
        trh.appendChild(th);
      });
      thead.appendChild(trh);

      // build body, skipping empty rows
      const tbody = document.querySelector('#sheet-table tbody');
      rows.forEach(cols => {
        const hasData = cols.some(c => c.trim() !== '');
        if (!hasData) return;
        const tr = document.createElement('tr');
        cols.forEach(c => {
          const td = document.createElement('td');
          td.textContent = c;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    window.addEventListener('DOMContentLoaded', loadSheet);
  </script>
</body>
</html>

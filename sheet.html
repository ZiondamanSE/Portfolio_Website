<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Live Sheet</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* small styles for our controls */
    .controls {
      text-align: center;
      margin: 20px 0;
    }
    .controls button,
    .controls a {
      font-family: 'AtkinsonMonoMedium', monospace;
      background: rgba(255,255,255,0.1);
      color: aliceblue;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 8px 16px;
      margin: 0 10px;
      border-radius: 6px;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .controls button:hover,
    .controls a:hover {
      background: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <img class="background-pixel" src="Background.gif" alt="" />

  <div class="name-title">
    <p class="name">Live Data</p>
    <p class="title">Updated in Real-Time</p>
  </div>

  <!-- controls: refresh + download -->
  <div class="controls">
    <button id="refresh-btn">Refresh Data</button>
    <a id="download-csv" href="#" download="sheet.csv">Download CSV</a>
  </div>

  <div class="sheet-wrapper">
    <table id="sheet-table">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>

  <footer class="site-footer">
    <p>DESIGN BY FLESH, PRODUCTION OF MACHINE, PRODUCED BY MAN.</p>
    <p> - ZIONDAMAN - </p>
  </footer>

  <script>
    const CSV_URL =
      'https://docs.google.com/spreadsheets/d/e/2PACX-1vTWj12eeHUgAAnIlaAMfALgxn7DdmGch_8wVZI9Sxahaudc5wv96Srbxs45oFYhtOAIJy87EbrIjS_F/pub?gid=0&single=true&output=csv';
    const PROXY = 'https://api.allorigins.win/raw?url=';

    const tableEl = document.getElementById('sheet-table');
    const thead = tableEl.querySelector('thead');
    const tbody = tableEl.querySelector('tbody');
    const refreshBtn = document.getElementById('refresh-btn');
    const downloadLink = document.getElementById('download-csv');

    // set download link href to bypass CORS via proxy
    downloadLink.href = PROXY + encodeURIComponent(CSV_URL);

    async function loadSheet() {
      // clear old table
      thead.innerHTML = '';
      tbody.innerHTML = '';

      try {
        const res = await fetch(PROXY + encodeURIComponent(CSV_URL));
        if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
        const csv = await res.text();
        renderCSV(csv);
      } catch (e) {
        console.error('Failed to load sheet:', e);
        const msg = document.createElement('tr');
        msg.innerHTML = `<td colspan="5" style="color:tomato; text-align:center;">
          ⚠️ Could not load data. Check console.
        </td>`;
        tbody.appendChild(msg);
      }
    }

    function renderCSV(csvText) {
      const lines = csvText.trim().split('\n').map(l => l.split(','));
      if (!lines.length) return;

      const [header, ...rows] = lines;

      // build header
      const headerRow = document.createElement('tr');
      header.forEach(col => {
        const th = document.createElement('th');
        th.textContent = col;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);

      // build body, skipping empty rows
      rows.forEach(cols => {
        const hasData = cols.some(c => c.trim() !== '');
        if (!hasData) return;
        const tr = document.createElement('tr');
        cols.forEach(c => {
          const td = document.createElement('td');
          td.textContent = c;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    // event listeners
    refreshBtn.addEventListener('click', loadSheet);
    window.addEventListener('DOMContentLoaded', loadSheet);
  </script>
</body>
</html>

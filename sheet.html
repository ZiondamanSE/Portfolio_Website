<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Live Sheet</title>
  <!-- your existing styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- pixel background -->
  <img
    class="background-pixel"
    src="Background.gif"
    alt=""
  />

  <!-- header -->
  <div class="name-title">
    <p class="name">Live Data</p>
    <p class="title">Updated in Real-Time</p>
  </div>

  <!-- sheet container -->
  <div class="sheet-wrapper">
    <table id="sheet-table">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>

  <footer class="site-footer">
    <p>DESIGN BY FLESH, PRODUCTION OF MACHINE, PRODUCED BY MAN.</p>
    <p> - ZIONDAMAN - </p>
  </footer>

  <!-- 1) Tabletop.js for JSONP loading -->
  <script src="https://cdn.jsdelivr.net/npm/tabletop@1.6.0/dist/tabletop.min.js"></script>
  <script>
    // ——— CONFIGURE: your "Publish to web" CSV URL ———
    // (File → Publish to web → Link → CSV of your sheet)
    const PUBLIC_CSV =
      'https://docs.google.com/spreadsheets/d/e/2PACX-1vTWj12eeHUgAAnIlaAMfALgxn7DdmGch_8wVZI9Sxahaudc5wv96Srbxs45oFYhtOAIJy87EbrIjS_F/pub?gid=0&single=true&output=csv';

    window.addEventListener('DOMContentLoaded', () => {
      Tabletop.init({
        key:      PUBLIC_CSV,
        callback: onData,
        simpleSheet: false
      });
    });

    function onData(data, tabletop) {
      // data is an object of sheets; we want the first one:
      const sheetName = Object.keys(data)[0];
      const rows = data[sheetName];

      // build header row from keys of first object
      const thead = document.querySelector('#sheet-table thead');
      const headerRow = document.createElement('tr');
      Object.keys(rows[0]).forEach(col => {
        const th = document.createElement('th');
        th.textContent = col;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);

      // build body, filtering empty rows
      const tbody = document.querySelector('#sheet-table tbody');
      rows.forEach(row => {
        // check if any value in this row is non-empty
        const hasData = Object.values(row).some(v => v.toString().trim() !== '');
        if (!hasData) return;

        const tr = document.createElement('tr');
        Object.values(row).forEach(cell => {
          const td = document.createElement('td');
          td.textContent = cell;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
